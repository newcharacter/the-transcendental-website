# UK Snow Nowcast Configuration
# All tuneable parameters - no hardcoded values in code

location:
  # Default location (Kent)
  latitude: 51.2787
  longitude: 1.0803
  name: "Canterbury, Kent"

# Data source configuration
data_sources:
  open_meteo:
    enabled: true
    base_url: "https://api.open-meteo.com/v1/forecast"
    update_interval_minutes: 15
    # No API key required

  environment_agency:
    enabled: true
    base_url: "https://environment.data.gov.uk/flood-monitoring"
    update_interval_minutes: 15
    # No API key required
    search_radius_km: 50

  met_office_datahub:
    enabled: true
    base_url: "https://data.hub.api.metoffice.gov.uk/sitespecific/v0"
