    update_interval_minutes: 60
    # Free tier: 360 calls/day

# Snow detection thresholds
snow_detection:
  # Temperature thresholds (Celsius)
  max_temp_for_snow: 2.0
  optimal_snow_temp_max: 0.5
  optimal_snow_temp_min: -5.0

  # Precipitation thresholds (mm/hour)
  min_precipitation_rate: 0.1
  heavy_snow_rate: 2.0

  # Confidence adjustments
  temp_confidence_weight: 0.4
  precip_confidence_weight: 0.4
  radar_confidence_weight: 0.2

# Nowcasting parameters
nowcasting:
  # Time windows (hours)
  short_term_hours: 2
  medium_term_hours: 6

  # Algorithm weights
  persistence_weight: 0.3
  model_weight: 0.5
  observation_weight: 0.2

# Logging configuration
logging:
  level: "INFO"
  event_log_dir: "data/events"
  retain_days: 30

# Dashboard settings
dashboard:
  refresh_interval_seconds: 300
  map_zoom_default: 10
  show_confidence_intervals: true
